name: Final review verification
on:
  push:
    branches: [review/profile-data-integrity]
    paths: [.github/workflows/review-audit.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - name: Reproduce active-editor baseline loss after an unrelated deletion
        run: |
          cat >> test/review-ui.test.mjs <<'JS'

          for (const action of ["save", "delete"]) {
            test(`${action} keeps the active edit baseline after deleting another profile`, async (t) => {
              const app = await open(t, {
                initial: { profiles: [profile(), profile("other")] },
                current: { profiles: [{ ...profile(), title: "Changed elsewhere" }, profile("other")] },
              });
              app.query('[data-edit="saved"]').click();
              app.enter("description", "My unfinished edit");
              app.query('[data-delete="other"]').click();
              app.query('[data-confirm-delete="other"]').click();
              await waitFor(() => /Deleted/.test(app.query(".status").textContent));
              assert.equal(app.writes.length, 1);
              assert.equal(app.query('[name="description"]').value, "My unfinished edit");
              if (action === "save") app.query('[type="submit"]').click();
              else {
                app.query('[data-delete="saved"]').click();
                app.query('[data-confirm-delete="saved"]').click();
              }
              await waitFor(() => app.query(".status").textContent !== "Saving...");
              assert.equal(app.writes.length, 1, "only the unrelated deletion may write");
              assert.match(app.query(".status").textContent, /changed in another editor/);
              assert.equal(app.query('[name="description"]').value, "My unfinished edit");
            });
          }
          JS
          set +e
          node --test --test-name-pattern 'keeps the active edit baseline' test/review-ui.test.mjs > /tmp/baseline-regression.log 2>&1
          status=$?
          set -e
          cat /tmp/baseline-regression.log
          test "$status" -ne 0
      - name: Pin the version the user actually started editing
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'src/main.mjs';
          let source = await readFile(path, 'utf8');
          const replacements = [
            ['  originalId: null,', '  originalId: null,\n  editingBaseline: null,'],
            ['  state.originalId = null;', '  state.originalId = null;\n  state.editingBaseline = null;'],
            ['    state.originalId = profile.id;', '    state.originalId = profile.id;\n    state.editingBaseline = structuredClone(profile);'],
            ['    const merged = mergeProfileChange(state.profiles, nextProfiles, current, changedId);', `    // Refreshing the sidebar after deleting another profile must not silently
              // adopt a new baseline for the still-unsaved active editor.
              const previous = state.editingBaseline?.id === changedId
                ? [...state.profiles.filter((profile) => profile.id !== changedId), state.editingBaseline]
                : state.profiles;
              const merged = mergeProfileChange(previous, nextProfiles, current, changedId);`],
          ];
          for (const [before, after] of replacements) {
            assert.equal(source.split(before).length, 2, 'unique replacement anchor');
            source = source.replace(before, () => after);
          }
          await writeFile(path, source);
          JS
      - name: Update only the vulnerable transitive package within its existing major
        run: |
          npm update fast-uri --package-lock-only --ignore-scripts
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFile } from 'node:fs/promises';
          const before = JSON.parse(execFileSync('git', ['show', 'HEAD:package-lock.json'], { encoding: 'utf8' }));
          const after = JSON.parse(await readFile('package-lock.json', 'utf8'));
          const key = 'node_modules/fast-uri';
          console.log('fast-uri update:', before.packages[key].version, '->', after.packages[key].version);
          assert.match(after.packages[key].version, /^3\./);
          delete before.packages[key];
          delete after.packages[key];
          assert.deepEqual(after, before, 'do not update unrelated dependencies');
          JS
          git diff --exit-code -- package.json
          npm ci
          npm audit --audit-level=high
      - name: Rebuild generated package and update digest fixture
        run: |
          npm run build
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import { readFile, writeFile } from 'node:fs/promises';
          import { packageDigest } from './scripts/package-digest.mjs';
          const path = 'test/package.test.mjs';
          const source = await readFile(path, 'utf8');
          const old = 'sha256-e2724d0cccc6e1c98ebfe406e182000f996bfc3db7022f7e130d71a2ef778285';
          assert.equal(source.split(old).length, 2);
          await writeFile(path, source.replace(old, await packageDigest('dist')));
          JS
      - run: npm run check
      - run: npm test
      - uses: actions/checkout@v6
        with:
          repository: ManuelZierl/kestral
          ref: 82a983a268911e7a1958b4c6eab06dde334070b1
          path: .kestral-contract
      - run: npm run test:package-schema -- .kestral-contract/schemas/app.schema.json
      - name: Commit verified changes and remove temporary workflow
        run: |
          rm .github/workflows/review-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.mjs test/review-ui.test.mjs test/package.test.mjs package-lock.json dist .github/workflows/review-audit.yml
          git diff --cached --stat
          git diff --cached --check
          git commit -m 'Pin active editing baselines and update vulnerable fast-uri dependency'
          git push origin HEAD:refs/heads/review/profile-data-integrity
